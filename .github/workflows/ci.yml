name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render Kubernetes manifests
        run: kubectl kustomize infra/k8s > /dev/null

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: black
        run: uv run black --check .
      - name: mypy
        run: uv run mypy libs services

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finai
          POSTGRES_PASSWORD: finai
          POSTGRES_DB: finai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finai" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://finai:finai@localhost:5432/finai_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      KAFKA_ENABLED: "false"
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Unit + integration tests
        run: uv run pytest -v --cov=libs --cov=services --cov-report=term-missing

      - name: Categorization accuracy (rules engine, no provider calls)
        run: uv run python -m scripts.eval_categorization --mode rules --min-accuracy 0.90

  build-images:
    needs: [dashboard, lint, manifests, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, transactions, assistant, insights, notifications]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (${{ matrix.service }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: financial-ai-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
