apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: financial-ai
resources:
  - namespace.yaml
  - dependencies.yaml
  - migration-job.yaml
  - apps.yaml
  - ingress.yaml
configMapGenerator:
  - name: platform-config
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=finai
      - KAFKA_ENABLED=true
      - LLM_ENABLED=false
      - TRANSACTIONS_URL=http://transactions:8000
      - ASSISTANT_URL=http://assistant:8000
      - INSIGHTS_URL=http://insights:8000
      - NOTIFICATIONS_URL=http://notifications:8000
      - ANOMALY_ALERT_THRESHOLD=0.8
      - LARGE_TRANSACTION_THRESHOLD=500
      - BUDGET_MONTHLY_LIMIT=1500
      - RATE_LIMIT_STANDARD=100
      - RATE_LIMIT_LLM=20
secretGenerator:
  # Local development only. Replace with External Secrets/Secrets Manager in a real cluster.
  - name: platform-secrets
    literals:
      - POSTGRES_USER=finai
      - POSTGRES_PASSWORD=finai-local-only
      - POSTGRES_DB=finai
      - DATABASE_URL=postgresql+asyncpg://finai:finai-local-only@postgres:5432/finai
      - JWT_SECRET=kind-dev-secret-change-me
      - INTERNAL_SERVICE_TOKEN=kind-internal-token-change-me
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: financial-ai-platform/backend
    newTag: local
  - name: financial-ai-platform/dashboard
    newTag: local
