apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financial-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: ledger-ai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { number: 80 } }
  # Production overlays should enable TLS and provide ledger-ai-tls via cert-manager.
  # tls: [{ hosts: [ledger-ai.example.com], secretName: ledger-ai-tls }]
