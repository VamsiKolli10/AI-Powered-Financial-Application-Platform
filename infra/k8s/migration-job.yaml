apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations
spec:
  backoffLimit: 6
  template:
    metadata: { labels: { app: database-migrations } }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done"]
          envFrom: [{ secretRef: { name: platform-secrets } }]
      containers:
        - name: migrate
          image: financial-ai-platform/backend:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - { configMapRef: { name: platform-config } }
            - { secretRef: { name: platform-secrets } }
