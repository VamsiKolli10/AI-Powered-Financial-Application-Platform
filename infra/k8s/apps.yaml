apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: financial-ai-platform/backend:local
          imagePullPolicy: IfNotPresent
          env: [{ name: SERVICE, value: gateway }, { name: SERVICE_NAME, value: gateway }]
          envFrom:
            - { configMapRef: { name: platform-config } }
            - { secretRef: { name: platform-secrets } }
          ports: [{ name: http, containerPort: 8000 }]
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5, failureThreshold: 12 }
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
