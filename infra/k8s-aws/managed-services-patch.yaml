apiVersion: batch/v1
kind: Job
metadata: { name: database-migrations }
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: migrate
          envFrom:
            - { configMapRef: { name: platform-config } }
            - { secretRef: { name: platform-secrets } }
            - { configMapRef: { name: platform-aws-config } }
