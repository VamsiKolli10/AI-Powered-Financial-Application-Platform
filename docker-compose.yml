name: financial-ai-platform

x-service-base: &service-base
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  restart: unless-stopped

x-healthcheck: &app-healthcheck
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finai}
      POSTGRES_DB: ${POSTGRES_DB:-finai}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finai} -d ${POSTGRES_DB:-finai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode - no Zookeeper.
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: finai-local-cluster
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    <<: [*service-base, *app-healthcheck]
    environment:
      SERVICE_NAME: gateway
      SERVICE: gateway
    ports: ["8000:8000"]

  transactions:
    <<: [*service-base, *app-healthcheck]
    environment:
      SERVICE_NAME: transactions
      SERVICE: transactions
    ports: ["8001:8000"]

  assistant:
    <<: [*service-base, *app-healthcheck]
    environment:
      SERVICE_NAME: assistant
      SERVICE: assistant
    ports: ["8002:8000"]

  insights:
    <<: [*service-base, *app-healthcheck]
    environment:
      SERVICE_NAME: insights
      SERVICE: insights
    ports: ["8003:8000"]

  notifications:
    <<: [*service-base, *app-healthcheck]
    environment:
      SERVICE_NAME: notifications
      SERVICE: notifications
    ports: ["8004:8000"]

volumes:
  pgdata:
  redisdata:
  kafkadata:
